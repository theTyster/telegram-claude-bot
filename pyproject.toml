[project]
name = "family-claude-bot"
version = "0.1.0"
description = "A Telegram bot for a family group chat, powered by Claude."
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk==0.2.168",
    "aiohttp==3.14.5",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
